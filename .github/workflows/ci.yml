name: Hyrule
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build generated-check vet
      - run: go test -race -p=1 -parallel=4 ./...
